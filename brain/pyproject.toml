[project]
name = "voicebridge-brain"
version = "0.1.0"
description = "VoiceBridge conversation brain: orchestration, memory, consent, knowledge, and language adapters."
requires-python = ">=3.10,<3.15"
dependencies = [
  "voicebridge-contract",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.0",
  "ruff>=0.9.0",
]

[tool.uv.sources]
voicebridge-contract = { path = "../contracts/python", editable = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["voicebridge_brain"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
